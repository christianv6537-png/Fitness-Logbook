<script>
const KEY='tracker_5x5_v1';
const DIAS=['L','M','X','J','V','S','D'];
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

/* campo, etiqueta, etiqueta corta, unidad, decimales */
const F_PESO=[
  ['peso','Peso','Peso','kg',1],
  ['grasa','Grasa corporal','Grasa','%',1],
  ['musculoEsq','Músculo esquelético','M. esquel.','%',1],
  ['masaMuscular','Masa muscular','M. muscular','kg',1],
  ['agua','Agua corporal','Agua','%',1],
  ['proteina','Proteína','Proteína','%',1],
  ['masaOsea','Masa ósea','M. ósea','kg',2],
  ['visceral','Grasa visceral','Visceral','',0],
  ['subcutanea','Grasa subcutánea','Subcutánea','%',1],
  ['bmr','Metabolismo basal','BMR','kcal',0],
  ['edadMet','Edad metabólica','Edad met.','años',0]
];
const F_MED=[
  ['cuello','Cuello','Cuello','cm',1],
  ['hombros','Hombros','Hombros','cm',1],
  ['pecho','Pecho','Pecho','cm',1],
  ['cintura','Cintura','Cintura','cm',1],
  ['abdomen','Abdomen','Abdomen','cm',1],
  ['cadera','Cadera','Cadera','cm',1],
  ['bicepsI','Bíceps izquierdo','Bíceps izq.','cm',1],
  ['bicepsD','Bíceps derecho','Bíceps der.','cm',1],
  ['musloI','Muslo izquierdo','Muslo izq.','cm',1],
  ['musloD','Muslo derecho','Muslo der.','cm',1],
  ['gemeloI','Gemelo izquierdo','Gemelo izq.','cm',1],
  ['gemeloD','Gemelo derecho','Gemelo der.','cm',1]
];

let S=null, view='inicio', calMes=null, draft=null, mem={};
/* bar: peso de la barra vacía en kg · man:1 → el peso es POR MANCUERNA · bw: fracción del peso corporal que cuenta */
const CAT=[
  {n:'Press banca plano',g:'push',w:60,inc:2.5,s:5,r:5,bar:20},
  {n:'Press banca inclinado',g:'push',w:40,inc:2.5,s:5,r:5,bar:20},
  {n:'Press militar',g:'push',w:30,inc:2.5,s:5,r:5,bar:20},
  {n:'Fondos',g:'push',w:0,inc:2.5,s:5,r:5,bw:1},
  {n:'Flexiones',g:'push',w:0,inc:0,s:4,r:15,bw:0.65},
  {n:'Dominada',g:'pull',w:0,inc:2.5,s:5,r:5,bw:1},
  {n:'Remo barra T',g:'pull',w:30,inc:2.5,s:5,r:5,bar:10,una:1},
  {n:'Remo en barra',g:'pull',w:40,inc:2.5,s:5,r:5,bar:20},
  {n:'Sentadilla',g:'pierna',w:60,inc:5,s:5,r:5,bar:20},
  {n:'Peso muerto',g:'pierna',w:70,inc:5,s:5,r:5,bar:20},
  {n:'Zancadas',g:'pierna',w:12,inc:2,s:3,r:10,bar:2,man:1},
  {n:'Hip thrust',g:'pierna',w:60,inc:5,s:4,r:8,bar:20},
  {n:'Extensiones tríceps',g:'accesorio',w:10,inc:2,s:3,r:12,bar:2,man:1},
  {n:'Tríceps barra Z',g:'accesorio',w:15,inc:2.5,s:3,r:12,bar:10},
  {n:'Curl bíceps barra Z',g:'accesorio',w:15,inc:2.5,s:3,r:12,bar:10},
  {n:'Curl bíceps mancuerna',g:'accesorio',w:10,inc:2,s:3,r:12,bar:2,man:1},
  {n:'Curl bíceps barra olímpica',g:'accesorio',w:25,inc:2.5,s:3,r:10,bar:20},
  {n:'Elevaciones frontales',g:'accesorio',w:8,inc:1,s:3,r:12,bar:2,man:1},
  {n:'Elevaciones laterales',g:'accesorio',w:8,inc:1,s:3,r:12,bar:2,man:1},
  {n:'Elevaciones abdominales',g:'accesorio',w:0,inc:0,s:3,r:15}
];
const GRUPOS={push:'Empuje',pull:'Tirón',pierna:'Pierna',accesorio:'Accesorio'};
const catDe=n=>CAT.find(c=>c.n===n);
const barDe=n=>{const c=catDe(n);return c&&c.bar!=null?c.bar:0;};
const esMan=n=>{const c=catDe(n);return !!(c&&c.man);};
const esUna=n=>{const c=catDe(n);return !!(c&&c.una);};
const ladosDe=n=>esUna(n)?1:2;
function porLado(n,total){
  const b=barDe(n);
  if(b<=0||esMan(n)) return null;
  const x=(total-b)/ladosDe(n);
  return x<0?null:x;
}
function desglose(n,w){
  const b=barDe(n);
  if(esMan(n)) return `por mancuerna, incluye ${fmt(b)} kg de barra`;
  if(b<=0) return catDe(n)&&catDe(n).bw?'peso añadido (lastre)':'';
  const discos=(w-b)/ladosDe(n);
  if(discos<0) return `menos que la barra vacía (${fmt(b)} kg)`;
  if(esUna(n)) return `≈${fmt(b)} kg de barra en landmine + ${fmt(discos)} en discos`;
  return `${fmt(b)} kg de barra + ${fmt(discos)} por lado`;
}
const TIPOS=['A','B','C'];
let selPeso='peso', selMed='cintura', selFza='Press banca plano', otroEdit={}, calSel=null;

/* ---------- almacenamiento ---------- */
const backend={
  async get(){
    if(window.storage){try{const r=await window.storage.get(KEY);return r?r.value:null;}catch(e){return null;}}
    try{return localStorage.getItem(KEY);}catch(e){return null;}
  },
  async set(v){
    if(window.storage){try{await window.storage.set(KEY,v);return true;}catch(e){return false;}}
    try{localStorage.setItem(KEY,v);return true;}catch(e){return false;}
  }
};
async function load(){
  try{const v=await backend.get(); S=v?JSON.parse(v):null;}catch(e){ S=null; }
  if(!S||!S.config) S=inicial();
  migrar();
}
async function save(){
  const ok=await backend.set(JSON.stringify(S));
  if(!ok){ mem[KEY]=S; toast('No se ha podido guardar en el dispositivo'); }
}
function inicial(){
  return {
    config:{
      A:[{n:'Sentadilla',w:60,inc:5,s:5,r:5},{n:'Press banca plano',w:60,inc:2.5,s:5,r:5},{n:'Remo barra T',w:30,inc:2.5,s:5,r:5},
         {n:'Elevaciones laterales',w:8,inc:1,s:3,r:12,opt:true},{n:'Extensiones tríceps',w:10,inc:2,s:3,r:12,opt:true}],
      B:[{n:'Peso muerto',w:70,inc:5,s:5,r:5},{n:'Press militar',w:30,inc:2.5,s:5,r:5},{n:'Dominada',w:0,inc:2.5,s:5,r:5},
         {n:'Curl bíceps mancuerna',w:10,inc:2,s:3,r:12,opt:true}],
      C:[{n:'Fondos',w:0,inc:2.5,s:5,r:5},{n:'Remo en barra',w:40,inc:2.5,s:5,r:5},{n:'Zancadas',w:12,inc:2,s:3,r:10},
         {n:'Press banca inclinado',w:40,inc:2.5,s:5,r:5,opt:true}],
      series:5, reps:5, altura:183,
      objetivo:{peso:85,fecha:'2026-12-31'}
    },
    peso:[
      {fecha:'2023-07-02',peso:84.75,grasa:24.9,musculoEsq:48.5,masaMuscular:60.5,agua:54.2,proteina:17.2,masaOsea:3.18,visceral:8,subcutanea:22.2,bmr:1744,edadMet:31},
      {fecha:'2026-09-08',peso:93},
      {fecha:'2026-09-09',peso:93.75,grasa:28.6,musculoEsq:46.2,masaMuscular:63.6,agua:51.6,proteina:16.2,masaOsea:3.35,visceral:10,subcutanea:25.2,bmr:1815,edadMet:38}
    ],
    medidas:[
      {fecha:'2021-10-23',cuello:37,hombros:112,pecho:106.5,cintura:89.3,abdomen:93.2,cadera:100,bicepsI:35.5,bicepsD:35,musloI:63.5,musloD:63,gemeloI:40.1,gemeloD:40.1},

function migrar(){
  const d=inicial();
  if(!S.dias) S.dias={};
  if(!S.config.objetivo) S.config.objetivo=d.config.objetivo;
  if(!S.config.altura) S.config.altura=183;
  if(!S.config.pesada0909){
    if(!S.peso.some(r=>r.fecha==='2026-09-09')){
      S.peso.push({fecha:'2026-09-09',peso:93.75,grasa:28.6,musculoEsq:46.2,masaMuscular:63.6,agua:51.6,proteina:16.2,masaOsea:3.35,visceral:10,subcutanea:25.2,bmr:1815,edadMet:38});
      S.peso.sort(ordFecha);
    }
    S.config.pesada0909=true;
  }
  if(!S.config.cTiron){
    const c=S.config.C;
    if(Array.isArray(c)){
      const rem=c.find(e=>e.n==='Remo en barra'), inc=c.find(e=>e.n==='Press banca inclinado');
      if(rem&&inc&&rem.opt&&!inc.opt){ rem.opt=false; inc.opt=true; c.sort((a,b)=>(a.opt?1:0)-(b.opt?1:0)); }
    }
    S.config.cTiron=true;
  }
  Object.values(S.dias).forEach(v=>{ if(v.andar===true&&!v.cardio) v.cardio='andar'; delete v.andar; });
  const REN={'Press banca':'Press banca plano','Remo T-barra':'Remo barra T','Press inclinado':'Press banca inclinado','Dominadas':'Dominada','Remo T':'Remo barra T','Tríceps':'Extensiones tríceps','Curl de bíceps':'Curl bíceps mancuerna'};
  TIPOS.forEach(t=>{
    if(!Array.isArray(S.config[t])||!S.config[t].length) S.config[t]=d.config[t];
    S.config[t].forEach(e=>{ if(REN[e.n]) e.n=REN[e.n]; });
    S.config[t].forEach(e=>{
      if(e.inc==null) e.inc=2.5;
      if(e.s==null) e.s=S.config.series||5;
      if(e.r==null) e.r=S.config.reps||5;
      if(e.opt==null) e.opt=false;
    });
  });
  Object.values(S.dias).forEach(v=>{ if(v.sesion) v.sesion.ej.forEach(e=>{ if(REN[e.n]) e.n=REN[e.n]; }); });
  if(!S.peso){
    S.peso=(S.medidas||[]).filter(m=>m.peso!=null).map(m=>({fecha:m.fecha,peso:m.peso}));
    if(!S.peso.some(p=>p.fecha==='2023-07-02')) S.peso.unshift(d.peso[0]);
    if(!S.peso.some(p=>p.fecha==='2026-09-08')) S.peso.push({fecha:'2026-09-08',peso:93});
    S.peso.sort(ordFecha);
  }
  (S.medidas||[]).forEach(m=>{delete m.peso;});
  if(!S.medidas||!S.medidas.length) S.medidas=d.medidas;
  if(!S.config.histRenpho){
    d.medidas.forEach(r=>{ if(!S.medidas.some(x=>x.fecha===r.fecha)) S.medidas.push(Object.assign({},r)); });
    S.medidas.sort(ordFecha);
    S.config.histRenpho=true;
  }
  if(!S.config.pesoRenpho908){
    (d.pesoRenpho||[]).forEach(r=>{ if(!S.peso.some(x=>x.fecha===r.fecha)) S.peso.push(Object.assign({},r)); });
    S.peso.sort(ordFecha);
    S.config.pesoRenpho908=true;
  }
}

/* ---------- utilidades ---------- */
const hoy=()=>iso(new Date());
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function corta(f){const p=f.split('-');return p[2]+'/'+p[1];}
function larga(f){return f.split('-').reverse().join('/');}
function num(v){if(v===''||v==null)return null;const n=parseFloat(String(v).replace(',','.'));return isNaN(n)?null:n;}
function fmt(n,d){if(n==null)return '—';const s=Number(n).toFixed(d==null?1:d).replace('.',',');return s.endsWith(',0')?s.slice(0,-2):s;}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function toast(t){const e=document.createElement('div');e.className='flash';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),1900);}
function ultP(){return S.peso[S.peso.length-1]||{};}
function ultM(){return S.medidas[S.medidas.length-1]||{};}
function serie(arr,campo){return arr.filter(r=>r[campo]!=null).map(r=>({f:r.fecha,v:r[campo]}));}
function imc(p){const h=(S.config.altura||183)/100;return p.peso!=null?p.peso/(h*h):null;}
function delta(arr,campo){
  const s=serie(arr,campo); if(s.length<2)return null;
  return s[s.length-1].v-s[s.length-2].v;
}
function deltaHTML(arr,campo,dec,inverso){
  const d=delta(arr,campo); if(d==null||Math.abs(d)<0.005)return '';
  const cls=inverso?(d<0?'down':'up'):(d>0?'up':'down');
  return ` <span class="${cls}">${d>0?'+':''}${fmt(d,dec)}</span>`;
}
function sesiones(){return Object.entries(S.dias).filter(([,v])=>v.sesion).sort((a,b)=>a[0]<b[0]?-1:1);}
function proximoTipo(){
  const s=sesiones().filter(([,v])=>TIPOS.includes(v.sesion.tipo));
  if(!s.length)return 'A';
  const i=TIPOS.indexOf(s[s.length-1][1].sesion.tipo);
  return TIPOS[(i+1)%TIPOS.length];
}
function pesoActual(nombre){
  const s=sesiones();
  for(let i=s.length-1;i>=0;i--){const e=s[i][1].sesion.ej.find(x=>x.n===nombre);if(e)return e.sig!=null?e.sig:e.w;}
  for(const t of TIPOS){const e=(S.config[t]||[]).find(x=>x.n===nombre);if(e)return e.w;}
  const c=catDe(nombre); return c?c.w:20;
}
function incDe(n){
  for(const t of TIPOS){const e=(S.config[t]||[]).find(x=>x.n===n);if(e&&e.inc!=null)return e.inc;}
  const c=catDe(n); return c?c.inc:2.5;
}
function pesoInicial(n){
  for(const t of TIPOS){const e=(S.config[t]||[]).find(x=>x.n===n);if(e)return e.w;}
  const c=catDe(n); return c?c.w:0;
}
function semanaActual(){
  const d=new Date(), dw=(d.getDay()+6)%7, l=new Date(d); l.setDate(d.getDate()-dw);
  let ses=0,and=0;
  let bici=0;
  for(let i=0;i<7;i++){const k=iso(new Date(l.getFullYear(),l.getMonth(),l.getDate()+i));const v=S.dias[k];if(v&&v.sesion)ses++;if(v&&v.cardio==='andar')and++;if(v&&v.cardio==='bici')bici++;}
  return {ses,and,bici,cardio:and+bici};
}

function grafica(pts,unidad,dec,etq){
  if(!pts.length) return `<div class="mut">Sin datos de ${etq.toLowerCase()} todavía.</div>`;
  if(pts.length===1) return `<div class="row"><span class="big">${fmt(pts[0].v,dec)}<span style="font-size:15px;font-weight:400"> ${unidad}</span></span><span class="mut">${larga(pts[0].f)}</span></div>
    <div class="note">Registra otra toma y aquí aparecerá la curva.</div>`;
  const W=320,H=150,L=10,R=12,T=26,B=24;
  const ys=pts.map(p=>p.v), mn=Math.min(...ys), mx=Math.max(...ys);
  const pad=(mx-mn)*0.25||Math.abs(mx*0.03)||1, lo=mn-pad, hi=mx+pad;
  const X=i=>L+(i/(pts.length-1))*(W-L-R);
  const Y=v=>T+(1-(v-lo)/(hi-lo))*(H-T-B);
  const linea=pts.map((p,i)=>`${i?'L':'M'}${X(i).toFixed(1)},${Y(p.v).toFixed(1)}`).join(' ');
  const area=`${linea} L${X(pts.length-1).toFixed(1)},${H-B} L${X(0).toFixed(1)},${H-B} Z`;
  const iMin=ys.indexOf(mn), iMax=ys.indexOf(mx), last=pts.length-1;
  const etiqV=i=>pts.length<=6||i===0||i===last||i===iMin||i===iMax;
  const etiqF=i=>pts.length<=5||i===0||i===last||(pts.length<=9&&i===Math.floor(last/2));
  return `<svg class="g" viewBox="0 0 ${W} ${H}" role="img" aria-label="${etq}">
    <defs><linearGradient id="gr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--pen)" stop-opacity=".28"/>
      <stop offset="1" stop-color="var(--pen)" stop-opacity="0"/>
    </linearGradient></defs>
    <line x1="${L}" y1="${H-B}" x2="${W-R}" y2="${H-B}" stroke="var(--rule)" stroke-width="1"/>
    <path d="${area}" fill="url(#gr)"/>
    <path d="${linea}" fill="none" stroke="var(--pen)" stroke-width="2" stroke-linejoin="round"/>
    ${pts.map((p,i)=>`
      <circle cx="${X(i).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="3" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.6"/>
      ${etiqV(i)?`<text x="${X(i).toFixed(1)}" y="${(Y(p.v)-9).toFixed(1)}" text-anchor="${i===0?'start':(i===last?'end':'middle')}" font-size="10" font-weight="700" fill="var(--ink)">${fmt(p.v,dec)}</text>`:''}
      ${etiqF(i)?`<text x="${X(i).toFixed(1)}" y="${H-8}" text-anchor="${i===0?'start':(i===last?'end':'middle')}" font-size="9" fill="var(--mut)">${corta(p.f)}</text>`:''}
    `).join('')}
  </svg>
  <div class="note">${etq}: ${fmt(pts[0].v,dec)} → ${fmt(pts[last].v,dec)} ${unidad} · ${pts.length} tomas · máx ${fmt(mx,dec)} / mín ${fmt(mn,dec)} · récord ${fmt(mn,dec)} el ${larga(pts[ys.indexOf(mn)].f)}. Los puntos van igual de separados aunque las fechas no lo estén.</div>`;
}

/* ---------- objetivo ---------- */
function objetivoDatos(){
  const p=serie(S.peso,'peso'), o=S.config.objetivo;
  const act=p.length?p[p.length-1].v:null;
  const semanas=Math.max(0,(new Date(o.fecha)-new Date(hoy()))/(7*864e5));
  const rest=act!=null?act-o.peso:null;
  const ritmoNec=(rest!=null&&semanas>0.2)?rest/semanas:null;
  /* ritmo real: solo tomas de las últimas 10 semanas, para no arrastrar histórico antiguo */
  let ritmoAct=null, base=null;
  const corte=Date.now()-70*864e5;
  const rec=p.filter(x=>new Date(x.f).getTime()>=corte);
  if(rec.length>1){
    const d=(new Date(rec[rec.length-1].f)-new Date(rec[0].f))/(7*864e5);
    if(d>0){ritmoAct=(rec[0].v-rec[rec.length-1].v)/d; base=rec[0];}
  }
  const ini=base?base.v:(p.length?p[p.length-1].v:null);
  const prog=(ini!=null&&act!=null&&ini!==o.peso)?Math.min(100,Math.max(0,(ini-act)/(ini-o.peso)*100)):0;
  return {act,rest,semanas,ritmoNec,ritmoAct,prog,o};
}

/* ---------- objetivos de proporciones ---------- */
const PULG=2.54;
function media(a,b){const v=[a,b].filter(x=>x!=null);return v.length?v.reduce((x,y)=>x+y,0)/v.length:null;}
function proporciones(){
  const m=ultM(), h=S.config.altura||183;
  const C=h*0.46;                      /* cintura objetivo: 46 % de la altura */
  return {m,h,C,grupos:[
    {g:'Tren superior', filas:[
      {k:'Cintura', act:m.cintura, min:h*0.45, max:h*0.47, tipo:'bajar', nota:`45–47 % de tu altura (${fmt(h,0)} cm)`},
      {k:'Hombros', act:m.hombros, min:C*1.45, max:C*1.618, tipo:'subir', nota:'1,45–1,618 × cintura · 1,45 es la banda atlética real, 1,618 el techo'},
      {k:'Pecho', act:m.pecho, min:C*1.25, max:C*1.40, tipo:'subir', nota:`1,25–1,40 × cintura · +${fmt(C*0.25/PULG,0)}–${fmt(C*0.40/PULG,0)} pulgadas sobre ella`},
      {k:'Brazo', act:media(m.bicepsI,m.bicepsD), min:m.cuello, tipo:'subir', nota:'igual al contorno del cuello'}
    ]},
    {g:'Tren inferior', filas:[
      {k:'Cadera', act:m.cadera, min:C*1.16, max:C*1.25, tipo:'rango', nota:'1,16–1,25 × cintura objetivo'},
      {k:'Muslo', act:media(m.musloI,m.musloD), min:C*0.75, tipo:'subir', nota:`0,75 × cintura objetivo · ${fmt(h*0.335)} cm por altura`},
      {k:'Gemelo', act:media(m.gemeloI,m.gemeloD), min:m.cuello, tipo:'subir', nota:'igual al cuello y al brazo (tríada de Reeves)'}
    ]}
  ]};
}
function filaObjetivo(f){
  if(f.act==null||f.min==null) return `<div class="goal"><div class="g1"><span>${f.k}</span><span class="mut">falta el dato</span></div><div class="g2"><span>${f.nota}</span></div></div>`;
  const max=f.max==null?f.min:f.max;
  const rango=Math.abs(max-f.min)>0.05;
  const obj=rango?`${fmt(f.min)}–${fmt(max)}`:fmt(f.min);
  let dif=0, cumple, pct, signo='';
  if(f.tipo==='bajar'){
    cumple=f.act<=max; dif=cumple?0:f.act-max; signo='−';
    pct=Math.min(100,Math.max(0,(max/f.act)*100));
  }else if(f.tipo==='rango'){
    cumple=f.act>=f.min&&f.act<=max;
    if(f.act>max){dif=f.act-max;signo='−';} else if(f.act<f.min){dif=f.min-f.act;signo='+';}
    pct=cumple?100:Math.min(100,Math.max(0,(f.act>max?max/f.act:f.act/f.min)*100));
  }else{
    cumple=f.act>=f.min; dif=cumple?0:f.min-f.act; signo='+';
    pct=Math.min(100,Math.max(0,(f.act/f.min)*100));
  }
  return `<div class="goal">
    <div class="g1"><span>${f.k}</span><b class="${cumple?'done':''}">${fmt(f.act)} <span class="mut" style="font-weight:400">→ ${obj} cm</span></b></div>
    <div class="minibar"><i style="width:${pct.toFixed(1)}%"></i></div>
    <div class="g2"><span>${f.nota}</span><span>${cumple?'✓ cumplido':`${signo}${fmt(dif)} cm`}</span></div>
  </div>`;
}
function tablaRatios(){
  const {m,h,C}=proporciones();
  const r=[
    ['Cintura / altura', m.cintura&&h?m.cintura/h:null, '0,45–0,47', 3],
    ['Hombros / cintura', m.hombros&&m.cintura?m.hombros/m.cintura:null, '1,45–1,618', 3],
    ['Pecho / cintura', m.pecho&&m.cintura?m.pecho/m.cintura:null, '1,25–1,40', 3],
    ['Brazo / cuello', media(m.bicepsI,m.bicepsD)&&m.cuello?media(m.bicepsI,m.bicepsD)/m.cuello:null, '1,00', 3],
    ['Cadera / cintura', m.cadera&&m.cintura?m.cadera/m.cintura:null, '1,16–1,25', 3],
    ['Muslo / cintura', media(m.musloI,m.musloD)&&m.cintura?media(m.musloI,m.musloD)/m.cintura:null, '0,75', 3],
    ['Muslo / altura', media(m.musloI,m.musloD)&&h?media(m.musloI,m.musloD)/h:null, '0,33–0,34', 3],
    ['Gemelo / cuello', media(m.gemeloI,m.gemeloD)&&m.cuello?media(m.gemeloI,m.gemeloD)/m.cuello:null, '1,00', 3]
  ];
  const dif=m.pecho&&m.cintura?(m.pecho-m.cintura)/PULG:null;
  return `<table>
    <tr><th>Ratio</th><th class="n">Actual</th><th class="n">Objetivo</th></tr>
    ${r.map(x=>`<tr><td>${x[0]}</td><td class="n"><b>${x[1]==null?'—':fmt(x[1],x[3])}</b></td><td class="n mut">${x[2]}</td></tr>`).join('')}
    <tr><td>Pecho − cintura</td><td class="n"><b>${dif==null?'—':fmt(dif)}″</b></td><td class="n mut">10–12″</td></tr>
  </table>`;
}

function selectEj(t,i,actual){
  const clave=t+':'+i;
  if(otroEdit[clave]) return `<input value="${esc(actual)}" onchange="edEj('${t}',${i},'n',this.value)" placeholder="Nombre del ejercicio">`;
  const enCat=CAT.some(c=>c.n===actual);
  const grupos=['push','pull','pierna','accesorio'];
  return `<select onchange="edEj('${t}',${i},'n',this.value)">
    ${enCat?'':`<option value="${esc(actual)}" selected>${esc(actual)}</option>`}
    ${grupos.map(g=>`<optgroup label="${GRUPOS[g]}">
      ${CAT.filter(c=>c.g===g).map(c=>`<option value="${esc(c.n)}" ${c.n===actual?'selected':''}>${esc(c.n)}</option>`).join('')}
    </optgroup>`).join('')}
    <option value="__otro">Otro (escribir)…</option>
  </select>`;
}
function editorTipo(t){
  return `<div style="margin:12px 0 4px"><b style="font-size:13px">Sesión ${t}</b></div>
  ${S.config[t].map((e,i)=>`
    <div class="edrow">
      <div><label>${e.opt?'Opcional':'Básico '+(i+1)}</label>${selectEj(t,i,e.n)}</div>
      <div><label>Inicio kg</label><input inputmode="decimal" value="${e.w}" onchange="edEj('${t}',${i},'w',this.value)"></div>
      <div><label>Incremento</label><input inputmode="decimal" value="${e.inc}" onchange="edEj('${t}',${i},'inc',this.value)"></div>
    </div>
    <div class="edrow" style="grid-template-columns:1fr 62px 62px">
      <div style="display:flex;align-items:flex-end;gap:6px">
        <button class="mini" aria-pressed="${!!e.opt}" onclick="edEj('${t}',${i},'opt',${!e.opt})">${e.opt?'Opcional':'Básico'}</button>
        <button class="mini" onclick="borrarEj('${t}',${i})">Quitar</button>
      </div>
      <div><label>Series</label><input inputmode="numeric" value="${e.s}" onchange="edEj('${t}',${i},'s',this.value)"></div>
      <div><label>Reps</label><input inputmode="numeric" value="${e.r}" onchange="edEj('${t}',${i},'r',this.value)"></div>
    </div>`).join('')}
  <button class="btn ghost" onclick="anadirEj('${t}')">+ Añadir ejercicio a la sesión ${t}</button>`;
}
async function edEj(t,i,campo,v){
  const e=S.config[t][i];
  if(campo==='n'){
    if(v==='__otro'){ otroEdit[t+':'+i]=true; render(); return; }
    const n=String(v).trim(); if(!n){toast('El nombre no puede quedar vacío');render();return;}
    e.n=n; otroEdit[t+':'+i]=false;
    const c=catDe(n);
    if(c){ e.w=pesoActual(n); e.inc=c.inc; e.s=c.s; e.r=c.r; }
  }
  else if(campo==='opt'){ e.opt=(v===true||v==='true'); S.config[t].sort((a,b)=>(a.opt?1:0)-(b.opt?1:0)); }
  else { const n=num(v); if(n==null||n<0){render();return;}
    e[campo]=(campo==='s'||campo==='r')?Math.max(1,Math.round(n)):n; }
  await save();
  if(draft&&draft.tipo===t){draft=nuevoDraft(t);draft.abrirEditor=true;}
  render();
}
async function anadirEj(t){
  const usados=S.config[t].map(e=>e.n);
  const c=CAT.find(x=>!usados.includes(x.n))||CAT[0];
  S.config[t].push({n:c.n,w:pesoActual(c.n),inc:c.inc,s:c.s,r:c.r,opt:false});

function generarD(){
  const ab=draft&&draft.abrirEditor;

  const sortea=g=>{
    const op=CAT.filter(c=>c.g===g);

    return pool[Math.floor(Math.random()*pool.length)];
  };

async function guardarSesion(){
  const ej=draft.ej.map(e=>{

    const inc=incDe(e.n);

    let sig=ok?e.w+inc:e.w;
    if(fallos>=3) sig=Math.round((e.w*0.9)/2.5)*2.5;

function stds(){
  const out={};
  Object.keys(STD_DEF).forEach(k=>{
    const d=STD_DEF[k], u=(S.config.std||{})[k];
    out[k]=u?Object.assign({},d,{v:u,src:'mío'}):d;
  });
  return out;
}
function pesoCorporal(){ const p=serie(S.peso,'peso'); return p.length?p[p.length-1].v:null; }
function cargaTotal(n,w){ const c=catDe(n), bw=pesoCorporal(); return w+((c&&c.bw&&bw)?bw*c.bw:0); }
function epley(carga,reps){ return carga*(1+Math.min(reps,12)/30); }
function umbrales(n,bwArg){
  const d=stds()[n], bw=bwArg||pesoCorporal();
  if(!d||!bw) return null;
  if(d.t==='ratio') return d.v.map(x=>x*bw);
  const ks=Object.keys(d.tab).map(Number).sort((a,b)=>a-b);
  const lo=ks.filter(k=>k<=bw).pop()??ks[0], hi=ks.find(k=>k>=bw)??ks[ks.length-1];
  if(lo===hi) return d.tab[lo].slice();
  const f=(bw-lo)/(hi-lo);
  return d.tab[lo].map((v,i)=>v+(d.tab[hi][i]-v)*f);
}
function marcaDe(n){
  const d=stds()[n];
  let mejor=null;
  sesiones().forEach(([f,v])=>{
    v.sesion.ej.filter(e=>e.n===n).forEach(e=>{
      const r=Math.max(...e.reps); if(r<=0) return;
      const val=d.t==='reps'?r:epley(cargaTotal(n,e.w),r);
      if(!mejor||val>mejor.v) mejor={v:val,f,estim:false};
    });
  });
  if(mejor) return mejor;
  const c=catDe(n); if(!c) return null;
  return {v:d.t==='reps'?c.r:epley(cargaTotal(n,pesoActual(n)),c.r), f:null, estim:true};
}
function serieMarca(n){
  const d=stds()[n], out=[];
  sesiones().forEach(([f,v])=>{
    const e=v.sesion.ej.find(x=>x.n===n); if(!e) return;
    const r=Math.max(...e.reps); if(r<=0) return;
    out.push({f,v:d.t==='reps'?r:epley(cargaTotal(n,e.w),r)});
  });
  return out;
}
function nivelDe(val,u){
  if(val<u[0]) return {i:-1,pct:Math.max(0,val/u[0])*20};
  for(let i=0;i<4;i++) if(val<u[i+1]) return {i,pct:(i+(val-u[i])/(u[i+1]-u[i]))*20};
  return {i:4,pct:100};
}

function graficaFza(pts,u,dec){
  if(pts.length<2) return `<div class="mut">Con dos sesiones registradas de este ejercicio aparecerá la curva con las bandas de nivel.</div>`;
  const W=320,H=170,L=10,R=12,Tp=16,B=22;
  const ys=pts.map(p=>p.v);
  const lo=Math.min(...ys,u[0])*0.93, hi=Math.max(...ys)*1.12;
  const X=i=>L+(i/(pts.length-1))*(W-L-R);
  const Y=v=>Tp+(1-(v-lo)/(hi-lo))*(H-Tp-B);
  const linea=pts.map((p,i)=>`${i?'L':'M'}${X(i).toFixed(1)},${Y(p.v).toFixed(1)}`).join(' ');
  const last=pts.length-1;
  return `<svg class="g" viewBox="0 0 ${W} ${H}" role="img">
    ${u.map((r,i)=>{const y=Y(r); return (y>Tp&&y<H-B)?`<line x1="${L}" y1="${y.toFixed(1)}" x2="${W-R}" y2="${y.toFixed(1)}" stroke="var(--rule)" stroke-dasharray="3 3"/><text x="${L+2}" y="${(y-3).toFixed(1)}" font-size="9" fill="var(--mut)">${NIV[i]}</text>`:'';}).join('')}
    <path d="${linea}" fill="none" stroke="var(--ink)" stroke-width="2"/>
    ${pts.map((p,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="3" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.6"/>
      ${(i===0||i===last)?`<text x="${X(i).toFixed(1)}" y="${H-8}" text-anchor="${i?'end':'start'}" font-size="9" fill="var(--mut)">${corta(p.f)}</text>`:''}`).join('')}
  </svg>
  <div class="note">De ${fmt(pts[0].v,dec)} a ${fmt(pts[last].v,dec)} en ${pts.length} sesiones registradas.</div>`;
}

    ${cel}
  </div>
  <div class="note">Toca un día para ver lo que hiciste. Las sesiones completas se registran solas al guardarlas en la pestaña Sesión; desde aquí solo puedes marcar o borrar. Este mes: ${total.filter(([,v])=>v.sesion).length} sesiones, ${total.filter(([,v])=>v.cardio==='andar').length} caminatas y ${total.filter(([,v])=>v.cardio==='bici').length} bicis.</div>
  ${detalleDia()}
  <div class="sec">
    <h2>Constancia</h2>
    <div class="stats">
      <div><b>${racha()}</b><span>semanas con 3 sesiones</span></div>
      <div><b>${sesiones().length}</b><span>sesiones totales</span></div>
      <div><b>${Object.values(S.dias).filter(v=>v.cardio==='andar').length}</b><span>caminatas</span></div>
      <div><b>${Object.values(S.dias).filter(v=>v.cardio==='bici').length}</b><span>bicis</span></div>
    </div>
  </div>`;
}
function mover(n){let m=calMes.m+n,a=calMes.a;if(m<0){m=11;a--}if(m>11){m=0;a++}calMes={a,m};render();}
function selDia(k){ calSel=(calSel===k)?null:k; render(); }
const esManual=v=>!!(v.sesion&&(v.sesion.manual||!v.sesion.ej||!v.sesion.ej.length));
function detalleDia(){
  if(!calSel) return '';
  const v=S.dias[calSel]||{};
  let body;
  if(v.sesion&&!esManual(v)){
    body=`<div class="row"><b>Sesión ${v.sesion.tipo}</b></div>`
      +v.sesion.ej.map(e=>`<div class="exf"><span>${esc(e.n)} · ${fmt(e.w)} kg</span><span class="${e.ok?'up':'down'}">${e.reps.join('·')}</span></div>`).join('');
  }else if(v.sesion&&esManual(v)){
    body=`<div class="row"><b>Sesión ${v.sesion.tipo}</b><span class="mut">marcada desde el calendario</span></div>
      <div class="note">Sin series registradas. Para ver el detalle, guárdala desde la pestaña Sesión.</div>`;
  }else if(v.cardio){
    body=`<div class="row"><b>${CARDIO[v.cardio]}</b></div>`;
  }else{
    body=`<div class="mut">Nada registrado este día.</div>`;
  }
  return `<div class="diadet">
    <div class="row" style="margin-bottom:8px"><b>${larga(calSel)}</b><button class="mini" onclick="selDia('${calSel}')">cerrar</button></div>
    ${body}
    <div class="chips" style="margin-top:10px">
      ${TIPOS.map(t=>`<button onclick="marcarManual('${t}')">Marcar ${t}</button>`).join('')}
      ${Object.keys(CARDIO).map(t=>`<button onclick="cardio('${t}',calSel).then(render)">${CARDIO[t]}</button>`).join('')}
      ${(v.sesion||v.cardio)?`<button onclick="borrarDia()">Borrar día</button>`:''}
    </div>
  </div>`;
}
async function marcarManual(t){
  const v=S.dias[calSel]||{};
  S.dias[calSel]=Object.assign({},v,{sesion:{tipo:t,manual:true,ej:[]}});
  await save(); render();
}
async function borrarDia(){
  delete S.dias[calSel]; await save(); render();
}
function racha(){
  const s=sesiones().map(([k])=>k); if(!s.length)return 0;
  const sem={};
  s.forEach(k=>{const d=new Date(k),dw=(d.getDay()+6)%7,l=new Date(d);l.setDate(d.getDate()-dw);sem[iso(l)]=(sem[iso(l)]||0)+1;});
  const claves=Object.keys(sem).sort().reverse(); let r=0;
  for(const c of claves){ if(sem[c]>=3)r++; else break; }
  return r;
}

/* ---------- copia ---------- */
function resumenDatos(){
  const ses=sesiones().length;
  const card=Object.values(S.dias).filter(v=>v.cardio).length;
  const kb=Math.max(1,Math.round(JSON.stringify(S).length/1024));
  return `<table style="margin-top:10px">
    <tr><td>Sesiones de pesas</td><td class="n"><b>${ses}</b></td></tr>
    <tr><td>Días de cardio</td><td class="n"><b>${card}</b></td></tr>
    <tr><td>Pesadas</td><td class="n"><b>${S.peso.length}</b></td></tr>
    <tr><td>Mediciones</td><td class="n"><b>${S.medidas.length}</b></td></tr>
    <tr><td>Rutina, cargas y estándares</td><td class="n"><b>✓</b></td></tr>
    <tr><td class="mut">Tamaño de la copia</td><td class="n mut">${kb} KB</td></tr>
  </table>`;
}
function avisoCopia(){
  const f=S.config.copia;
  if(!f) return '<div class="note">Todavía no has hecho ninguna copia.</div>';
  const dias=Math.floor((new Date(hoy())-new Date(f))/864e5);
  return `<div class="note">Última copia: ${larga(f)}${dias>30?` · hace ${dias} días, toca hacer otra`:` · hace ${dias} día${dias===1?'':'s'}`}</div>`;
}
async function marcaCopia(){ S.config.copia=hoy(); await save(); }
async function copiarDatos(){
  const txt=JSON.stringify(S);
  try{
    await navigator.clipboard.writeText(txt);
    await marcaCopia(); render();
    toast('Datos copiados · pégalos en tus notas');
  }catch(e){
    togglePegar(); const t=document.getElementById('pegarTxt');
    if(t){t.value=txt;t.select();}
    toast('Copia el texto de abajo a mano');
  }
}
function togglePegar(){ document.getElementById('pegarBox').classList.toggle('hide'); }
async function pegarDatos(){
  const t=document.getElementById('pegarTxt');
  let d=null;
  try{ d=JSON.parse(t.value); }catch(e){ d=null; }
  if(!d||!d.config||!d.medidas){ toast('Ese texto no es una copia válida'); return; }
  S=d; migrar(); await save(); go('inicio'); toast('Copia restaurada');
}
function exportar(){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));
  a.download='entreno-'+hoy()+'.json'; a.click(); marcaCopia();
}
function importar(inp){
  const f=inp.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=async()=>{try{const d=JSON.parse(r.result);if(!d.config)throw 0;S=d;migrar();await save();go('inicio');toast('Datos importados');}catch(e){toast('El archivo no tiene el formato esperado');}};
  r.readAsText(f);
}

if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
load().then(render);
</script>
